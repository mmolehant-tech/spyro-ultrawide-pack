; Live FOV hotkeys for Spyro Reignited Trilogy.
; Works together with SpyroReignitedTrilogy.WidescreenFix.asi (by xan1242) in this folder.
; Keys are Windows virtual-key codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes

[Hotkeys]
IncreaseKey = 0x6B      ; Numpad +   wider view
DecreaseKey = 0x6D      ; Numpad -   narrower view
ResetKey = 0x6A         ; Numpad *   back to ResetFOVScalar

[FOV]
Step = 0.01             ; change per tap (0.01 = 1 percent). Hold a key to keep changing.
Min = 0.60
Max = 1.40
ResetFOVScalar = 1.00   ; value the reset key returns to (1.00 = the standard view for your screen)
